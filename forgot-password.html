<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Forgot Password</title>

  <link
    rel="stylesheet"
    href="assets/css/output.css"
  />

  <script
    src="https://code.jquery.com/jquery-3.6.0.min.js"
  ></script>
</head>

<body
  class="m-0 p-0 bg-[#F9F9F9] overflow-hidden"
>

  <main
    class="w-screen h-screen overflow-hidden bg-[#F9F9F9]"
  >

    <!-- ====================================================
         FULL SCREEN BACKGROUND
    ===================================================== -->

    <div
      class="fixed inset-0 w-screen h-screen"
    >

      <img
        src="assets/images/along-admin-bg.jpg"
        alt="Background"
        class="w-full h-full object-cover"
      />

      <div
        class="absolute inset-0 bg-black/40"
      ></div>

    </div>


    <!-- ====================================================
         PAGE CONTENT
    ===================================================== -->

    <div
      class="relative z-10 w-screen h-screen flex items-center justify-center px-[20px]"
    >

      <!-- ==================================================
           CARD
      =================================================== -->

      <section
        class="w-[452px] max-w-full rounded-[10px] bg-white px-[33px] pt-[40px] pb-[40px] shadow-[0_48px_100px_0_rgba(17,12,46,0.15)]"
      >

        <div
          class="w-full flex flex-col items-center"
        >


          <!-- ==================================================
               LOGO
          =================================================== -->

          <div
            class="shrink-0"
          >

            <img
              src="./assets/images/Asset 26along copy 2.png"
              alt="Along Logo"
              class="w-[124px] h-[102px] object-contain"
            />

          </div>


          <!-- ==================================================
               TITLE
          =================================================== -->

          <div
            class="mt-[24px] flex flex-col items-center"
          >

            <h1
              class="w-full text-center text-[34px] leading-[36px] font-semibold text-[#11313B]"
              style="
                font-family:
                  'Neue Haas Grotesk Display Pro',
                  'Helvetica Neue',
                  Arial,
                  sans-serif;
              "
            >
              Forgot your password?
            </h1>


            <p
              class="mt-[10px] w-[320px] max-w-full text-center text-[13px] leading-[20px] font-normal text-[#7C8AA0]"
              style="
                font-family:
                  'Neue Haas Grotesk Display Pro',
                  'Helvetica Neue',
                  Arial,
                  sans-serif;
              "
            >
              Enter the email address associated with your admin account and we'll send you a password reset link.
            </p>

          </div>


          <!-- ==================================================
               FORM
          =================================================== -->

          <form
            id="forgotPasswordForm"
            class="mt-[28px] w-[320px] max-w-full flex flex-col"
          >


            <!-- =================================================
                 MESSAGE
            ================================================== -->

            <div
              id="forgotPasswordMessage"
              class="hidden mb-[14px] w-full rounded-[6px] px-[12px] py-[10px] text-center text-[12px] leading-[18px] font-medium"
              style="
                font-family:
                  'Neue Haas Grotesk Display Pro',
                  'Helvetica Neue',
                  Arial,
                  sans-serif;
              "
            ></div>


            <!-- =================================================
                 EMAIL
            ================================================== -->

            <div
              class="flex flex-col"
            >

              <label
                for="forgotPasswordEmail"
                class="w-full text-[12px] leading-[16px] font-medium tracking-[0.4px] text-[#7C8AA0]"
                style="
                  font-family:
                    'Neue Haas Grotesk Display Pro',
                    'Helvetica Neue',
                    Arial,
                    sans-serif;
                "
              >
                Email Address
              </label>


              <div
                class="relative mt-[4px] w-full h-[45px]"
              >

                <input
                  type="email"
                  id="forgotPasswordEmail"
                  name="email"
                  autocomplete="email"
                  placeholder="Enter your email address"
                  class="w-full h-full rounded-[5px] border border-black/10 bg-white px-3 text-[#11313B] outline-none"
                />

              </div>

            </div>


            <!-- =================================================
                 SEND RESET LINK BUTTON
            ================================================== -->

            <button
              type="submit"
              id="sendResetLinkBtn"
              class="mt-[24px] w-full h-[45px] rounded-[5px] bg-[#3BB273] hover:bg-[#4F8D61] text-white text-[14px] transition-colors duration-200 font-medium cursor-pointer"
              style="
                font-family:
                  'Neue Haas Grotesk Display Pro',
                  'Helvetica Neue',
                  Arial,
                  sans-serif;
              "
            >
              Send Reset Link
            </button>


            <!-- =================================================
                 BACK TO LOGIN
            ================================================== -->

            <a
              href="login.html"
              class="mt-[20px] text-center text-[13px] leading-[18px] font-medium text-[#3BB273]"
              style="
                font-family:
                  'Neue Haas Grotesk Display Pro',
                  'Helvetica Neue',
                  Arial,
                  sans-serif;
              "
            >
              Back to Sign In
            </a>


          </form>

        </div>

      </section>

    </div>

  </main>


  <!-- ========================================================
       FORGOT PASSWORD JAVASCRIPT
  ========================================================= -->

  <script
    src="./assets/js/forgot-password.js"
  ></script>

</body>
</html>
