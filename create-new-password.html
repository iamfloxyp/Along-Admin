<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create New Password</title>
  <link rel="stylesheet" href="assets/css/output.css" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="m-0 p-0 bg-[#F9F9F9] overflow-hidden">

  <main class="w-screen h-screen flex items-center justify-center overflow-hidden bg-[#F9F9F9]">
    <section
      class="relative w-full max-w-[1280px] aspect-[1280/832] max-h-screen overflow-hidden bg-[#F9F9F9]"
    >
      <!-- BACKGROUND -->
      <div class="absolute inset-0 overflow-hidden">
        <img
          src="./assets/images/background.png"
          alt="Background"
          class="absolute max-w-none w-[1739px] h-[949px] top-[-34px] left-[-412px]"
        />
        <div class="absolute inset-0 bg-black/40"></div>
      </div>

      <!-- CARD -->
      <section
        class="absolute top-[119px] left-[414px] w-[452px] h-[593px] rounded-[10px] bg-white pt-[40px] pr-[33px] pb-[40px] pl-[33px] shadow-[0_48px_100px_0_rgba(17,12,46,0.15)]"
      >
        <div class="h-full flex flex-col items-center">
          <!-- LOGO -->
          <div class="shrink-0">
            <img
              src="./assets/images/along-logo.png"
              alt="Along Logo"
              class="w-[124px] h-[102px] object-contain"
            />
          </div>

          <!-- TITLE -->
          <div class="mt-[24px] flex flex-col items-center shrink-0">
            <h1
              class="w-[386px] text-center text-[34px] leading-[36px] font-semibold text-[#11313B]"
              style="font-family: 'Neue Haas Grotesk Display Pro', 'Helvetica Neue', Arial, sans-serif;"
            >
              Create a new password
            </h1>
          </div>

          <!-- FORM -->
          <form id="createPasswordForm" class="mt-[28px] w-[320px] flex flex-col">
            <!-- PASSWORD -->
            <div class="flex flex-col">
              <label
                for="newPassword"
                class="w-[320px] text-[12px] leading-[16px] font-medium tracking-[0.4px] text-[#7C8AA0]"
                style="font-family: 'Neue Haas Grotesk Display Pro', 'Helvetica Neue', Arial, sans-serif;"
              >
                Password
              </label>

              <div class="relative mt-[4px] w-[320px] h-[45px]">
                <input
                  type="password"
                  id="newPassword"
                  name="newPassword"
                  class="w-full h-full rounded-[5px] border border-black/10 bg-white px-3 pr-10 text-[#11313B] outline-none"
                />

                <button
                  type="button"
                  id="toggleNewPassword"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-[#7C8AA0]"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-4 h-4"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="1.8"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7Z"
                    />
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="mt-[16px] flex flex-col">
              <label
                for="confirmPassword"
                class="w-[320px] text-[12px] leading-[16px] font-medium tracking-[0.4px] text-[#7C8AA0]"
                style="font-family: 'Neue Haas Grotesk Display Pro', 'Helvetica Neue', Arial, sans-serif;"
              >
                Confirm Password
              </label>

              <div class="relative mt-[4px] w-[320px] h-[45px]">
                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  class="w-full h-full rounded-[5px] border border-black/10 bg-white px-3 pr-10 text-[#11313B] outline-none"
                />

                <button
                  type="button"
                  id="toggleConfirmPassword"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-[#7C8AA0]"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-4 h-4"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="1.8"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7Z"
                    />
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <!-- BUTTON -->
            <button
              type="submit"
              id="updatePasswordBtn"
              class="mt-[24px] w-[320px] h-[45px] rounded-[5px] bg-gradient-to-r from-[#6FE7F7] to-[#49D6F2] text-white text-[14px] font-medium"
              style="font-family: 'Neue Haas Grotesk Display Pro', 'Helvetica Neue', Arial, sans-serif;"
            >
              Password Updated
            </button>
          </form>
        </div>
      </section>
    </section>
  </main>

  <script src="./assets/js/create-new-password.js"></script>
</body>
</html>
